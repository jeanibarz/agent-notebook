name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Cancel a superseded in-progress run when a newer commit lands on the same ref.
# The group is keyed on the workflow + ref so each PR (refs/pull/<n>/merge) and
# the default branch get their own lane. cancel-in-progress is gated to
# pull_request events, so a protected `main` push run is never cancelled
# mid-flight; only redundant PR runs are.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run build
      # Type-check the test files and both vitest configs (tsconfig.test.json),
      # which `tsc` in the build step excludes (issue #382). One leg is enough:
      # the result does not depend on the OS, and TypeScript runs on Node 18 too.
      - run: npm run typecheck
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
      # vitest 5 imports `styleText` from node:util, which only exists on
      # Node 20.12+, so the suite cannot run on Node 18. The build step above
      # still verifies the package compiles on its minimum engine (>=18).
      #
      # In CI, vitest.config.ts adds the `github-actions` reporter (annotates
      # each failing test inline on the PR) and the `junit` reporter (writes
      # junit.xml), so a red leg names the failing test instead of forcing a
      # raw-log scroll (issue #248).
      - run: npm test
        if: matrix.node-version != 18

      # Machine-readable result for triage: only uploaded when a test leg
      # failed, and keyed per matrix leg so the six legs never collide on one
      # artifact name. `if-no-files-found: ignore` keeps the step green if a
      # pre-test step failed before junit.xml was written.
      - name: Upload JUnit test results
        if: failure() && matrix.node-version != 18
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.os }}-node${{ matrix.node-version }}
          path: junit.xml
          if-no-files-found: ignore
          retention-days: 7
      # Node 18 cannot load Vitest (see above), so the suite is skipped there and
      # the shipped code would otherwise never RUN on its minimum engine. Instead
      # run a dependency-free runtime smoke of the built CLI — the only leg that
      # actually executes the package on Node 18 (issue #231).
      - run: node scripts/smoke-node18.mjs
        if: matrix.node-version == 18
