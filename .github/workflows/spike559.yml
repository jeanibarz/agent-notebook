# Spike #559 only. Lives on a throwaway branch that is never merged and never opened as a pull request.
# No secrets, no login, no write permission. Each job prints what it measures.
name: spike-559
on:
  push:
    branches:
      - 'spike/559-**'
    paths-ignore:
      - 'spike559/raw/**'
permissions: {}
concurrency:
  group: spike559-${{ github.sha }}
  cancel-in-progress: false
env:
  DISABLE_AUTOUPDATER: '1'
  CLAUDE_VERSION: '2.1.332'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: |
          mkdir -p zips
          for v in 1.0.0 2.0.0; do
            sh spike559/build-plugin.sh $v
            (cd plugins/agent-notebook && zip -qrX "$GITHUB_WORKSPACE/zips/plugin-v$v.zip" .)
          done
          (cd zips && mv plugin-v1.0.0.zip plugin-v1.zip && mv plugin-v2.0.0.zip plugin-v2.zip)
          node spike559/build-v1.mjs zips 0.0.1-e2e.1 0.0.1-e2e.2
          ls -l zips
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zips
          path: zips
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
  loop:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: zips
          path: zips
      - name: Install Claude Code (native installer, pinned)
        if: runner.os != 'Windows'
        run: curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_VERSION"
      - name: Install Claude Code (native installer, pinned)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & ([scriptblock]::Create((irm https://claude.ai/install.ps1))) $env:CLAUDE_VERSION
      - name: Q2 Q3 Q6 loopback marketplace, install, update, rollback, uninstall
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash spike559/loop.sh "$GITHUB_WORKSPACE/zips"
      - name: Q1 planted node, POSIX
        if: runner.os != 'Windows'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash spike559/planted-posix.sh "$GITHUB_WORKSPACE/zips"
      - name: Q1 planted node, Windows setup (install the plugin by the archive route)
        if: runner.os == 'Windows'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash spike559/planted-posix.sh "$GITHUB_WORKSPACE/zips"
      - name: Q1 planted node, Windows probes
        if: runner.os == 'Windows'
        shell: powershell
        run: .\spike559\planted-windows.ps1
  x9:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 16
      - run: |
          d="$(dirname "$(command -v node)")"; [ "$RUNNER_OS" = Windows ] && d="$(cygpath -w "$d")"; echo "NODE_OLD_DIR=$d" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: zips
          path: zips
      - name: Install Claude Code (native installer, pinned)
        if: runner.os != 'Windows'
        run: curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_VERSION"
      - name: Install Claude Code (native installer, pinned)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & ([scriptblock]::Create((irm https://claude.ai/install.ps1))) $env:CLAUDE_VERSION
      - name: X9 install our STORE zip, sessions, bin/nb
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash spike559/x9.sh "$GITHUB_WORKSPACE/zips"
      - name: X9 Windows sessions and nb.cmd
        if: runner.os == 'Windows'
        shell: powershell
        run: .\spike559\x9-windows.ps1
  x13:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Claude Code (native installer, pinned)
        if: runner.os != 'Windows'
        run: curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_VERSION"
      - name: Install Claude Code (native installer, pinned)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & ([scriptblock]::Create((irm https://claude.ai/install.ps1))) $env:CLAUDE_VERSION
      - name: X13 polyglot hook, POSIX
        if: runner.os != 'Windows'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash spike559/x13.sh
      - name: X13 polyglot hook, Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: .\spike559\x13.ps1
  x16:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: distart
      - name: Install Claude Code (native installer, pinned)
        if: runner.os != 'Windows'
        run: curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_VERSION"
      - name: Install Claude Code (native installer, pinned)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & ([scriptblock]::Create((irm https://claude.ai/install.ps1))) $env:CLAUDE_VERSION
      - name: X16 build zip, install into a spaced non-ASCII home, POSIX sessions
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash spike559/x16.sh "$GITHUB_WORKSPACE/distart"
      - name: X16 Windows sessions
        if: runner.os == 'Windows'
        shell: powershell
        run: .\spike559\x16-windows.ps1
  managed:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: zips
          path: zips
      - name: Install Claude Code (native installer, pinned)
        run: curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_VERSION"
      - name: Q5 managed settings
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash spike559/managed.sh "$GITHUB_WORKSPACE/zips"
  entry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [10, 12, 14, 16, 18, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Q4 entry file
        run: bash spike559/entry-test.sh
