<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-notebook launch film · vertical 9:16</title>
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="film.css">
<link rel="stylesheet" href="scenes-a.css">
<link rel="stylesheet" href="scenes-b.css">
<link rel="stylesheet" href="vertical.css">
</head>
<body>
<main id="shell">
  <!-- #fit takes the scaled size in the page; #frame is the 1080x1920 canvas inside it.
       player.js scales #stage to #frame: vertical.css pins the stage's transform to the crop instead. -->
  <div id="fit">
    <div id="frame" role="img" aria-label="agent-notebook launch film, vertical cut">
      <header id="v-title">
        <p id="v-brand"></p>
        <h1 id="v-headline"><span></span><span></span></h1>
      </header>
      <div id="v-window"><div id="stage"></div></div>
      <div id="v-caption" aria-hidden="true"><span></span><span></span></div>
    </div>
  </div>
  <p id="caption" aria-live="off"></p>
  <div id="controls">
    <button id="play" type="button" aria-pressed="false">Play</button>
    <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Position">
    <span id="clock">0:00 / 0:00</span>
    <label class="cc"><input id="cc" type="checkbox" checked> Captions</label>
  </div>
  <audio id="audio" preload="auto" src="out/mix.mp3"></audio>
</main>
<script src="vendor/gsap.min.js"></script>
<script src="engine.js"></script>
<script src="components.js"></script>
<script src="scenes-a.js"></script>
<script src="scenes-b.js"></script>
<script src="captions.js"></script>
<script src="vertical.js"></script>
<script src="player.js"></script>
</body>
</html>
